name: Encerrar desafio

on:
  workflow_call:
    inputs:
      evidence:
        description: Publicação aprovada no desafio do Passo 6
        required: true
        type: string

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  close:
    name: Registrar o desafio e encerrar a issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o tutor da branch principal
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Instalar dependências do tutor
        run: npm ci --prefix .github/tutor --ignore-scripts --no-audit --no-fund
      - name: Encerrar sem duplicar mensagens
        uses: actions/github-script@v9
        env:
          EVIDENCE: ${{ inputs.evidence }}
        with:
          script: |
            await require('./.github/tutor/lifecycle.cjs').closeBonus({ github, context, core });
