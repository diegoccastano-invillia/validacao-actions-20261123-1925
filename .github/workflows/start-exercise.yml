# Adaptação local do ciclo do skills/exercise-toolkit: mensagens pt-BR e início idempotente.
name: Preparar exercício

on:
  workflow_call:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  start:
    name: Preparar a issue e a primeira atividade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o tutor da branch principal
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Instalar dependências do tutor
        run: npm ci --prefix .github/tutor --ignore-scripts --no-audit --no-fund
      - name: Iniciar sem apagar o progresso existente
        uses: actions/github-script@v9
        with:
          script: |
            await require('./.github/tutor/lifecycle.cjs').start({ github, context, core });
