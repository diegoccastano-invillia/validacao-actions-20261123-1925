name: Publicar próxima atividade

on:
  workflow_call:
    inputs:
      step:
        description: Etapa que acabou de passar
        required: true
        type: number
      evidence:
        description: Execução e commit aprovados
        required: true
        type: string

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  advance:
    name: Liberar a próxima etapa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o tutor da branch principal
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Instalar dependências do tutor
        run: npm ci --prefix .github/tutor --ignore-scripts --no-audit --no-fund
      - name: Publicar sem duplicar comentários
        uses: actions/github-script@v9
        env:
          STEP: ${{ inputs.step }}
          EVIDENCE: ${{ inputs.evidence }}
        with:
          script: |
            await require('./.github/tutor/lifecycle.cjs').advance({ github, context, core });
