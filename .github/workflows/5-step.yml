name: Passo 5

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: tutor-exercicio
  cancel-in-progress: false

jobs:
  find_exercise:
    name: Localizar exercício
    if: >-
      !github.event.repository.is_template &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    uses: ./.github/workflows/find-exercise.yml
    with:
      step: 5
    permissions:
      contents: read
      issues: read
  check_step_work:
    name: Avaliar atividade
    needs: find_exercise
    if: needs.find_exercise.outputs.active == 'true'
    uses: ./.github/workflows/check-step.yml
    with:
      step: 5
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
      deployments: read
      pages: read
  finish_exercise:
    name: Concluir exercício
    needs: [find_exercise, check_step_work]
    if: needs.check_step_work.outputs.passed == 'true'
    uses: ./.github/workflows/finish-exercise.yml
    with:
      evidence: ${{ needs.check_step_work.outputs.evidence }}
    permissions:
      contents: write
      actions: write
      issues: write
